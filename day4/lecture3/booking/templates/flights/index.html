{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booking</title>
</head>

<body style="background-color: antiquewhite; font-family: Arial, Helvetica, sans-serif;">
    <main style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        {% if date %}
        <div
            style= " display: block; text-align: center; justify-content: center;  border: 1px solid black; border-radius: 10px; width: 400px; height: 200px;  align-items: center; text-align: center; ">
            <h1 style="font: bold; color: black;">{{name}}</h1>
            <p style="font: 500; font-size: small; color: gray;">The flight will depart at 1200H</p>
        </div>
        {%else%}
        <div
            style=" display: block; justify-content: center;  border: 1px solid black; border-radius: 10px; width: 400px; height: 200px; align-items: center; text-align: center; ">
            <h1 style="font: bold; color: black;">{{name}}</h1>
            <p style="font: 500; font-size: small; color: gray;">There's no trip scheduled for {{name}} on {{date}}</p>

        </div>
        {% endif %}
    </main>

</body>

</html>
